<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>리스트</h1>
    <table>
      <thead>
        <tr>
          <td>id</td>
          <td>name</td>
          <td>grade</td>

          </tr>
        </tbody>
      </thead>
    </table>
  </body>
</html>
